<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uttar Pradesh — Product Coverage Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ── RESET ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: #0f172a;
    }

    /* ── SIDEBAR ────────────────────────────────────────── */
    #sidebar {
      width: 300px;
      min-width: 300px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1e293b;
      overflow: hidden;
      z-index: 10;
    }

    /* header */
    .sb-head {
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .sb-head h1 {
      font-size: 14px; font-weight: 700; color: #f1f5f9;
      letter-spacing: 0.2px; display: flex; align-items: center; gap: 7px;
    }
    .sb-head h1 .badge {
      font-size: 10px; background: #166534; color: #4ade80;
      padding: 2px 6px; border-radius: 99px; font-weight: 600;
    }
    .sb-head p { font-size: 11px; color: #64748b; margin-top: 4px; }

    /* progress */
    .sb-progress {
      padding: 14px 18px;
      background: #0a1020;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .prog-row span { font-size: 11px; color: #64748b; }
    .prog-row strong { font-size: 14px; font-weight: 700; color: #4ade80; }
    .prog-track {
      background: #1e293b; border-radius: 6px; height: 7px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      transition: width .4s ease;
      width: 0%;
    }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; margin-top: 10px;
    }
    .sc {
      background: #1e293b; border-radius: 8px; padding: 8px 6px;
      text-align: center; border: 1px solid #334155;
    }
    .sc .sv { font-size: 20px; font-weight: 700; color: #4ade80; }
    .sc .sl { font-size: 9px; color: #64748b; margin-top: 1px; text-transform: uppercase; letter-spacing: .4px; }

    /* paint controls */
    .sb-ctrl {
      padding: 11px 18px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .ctrl-label { font-size: 9.5px; color: #475569; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 7px; }
    .paint-row { display: flex; gap: 4px; }
    .pb {
      flex: 1; padding: 6px 2px; border: 2px solid transparent;
      border-radius: 6px; cursor: pointer; font-size: 9.5px; font-weight: 700;
      text-align: center; transition: all .15s; line-height: 1.4; outline: none;
    }
    .pb:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .pb.active { border-color: #f1f5f9; box-shadow: 0 0 0 3px rgba(241,245,249,.2); }

    /* search */
    .sb-search {
      padding: 8px 18px 10px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .sb-search input {
      width: 100%; padding: 7px 11px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 7px; color: #e2e8f0; font-size: 12px;
      outline: none; transition: border-color .15s;
    }
    .sb-search input:focus { border-color: #4ade80; }
    .sb-search input::placeholder { color: #475569; }

    /* district list */
    #dist-list {
      flex: 1; overflow-y: auto; padding: 4px 8px;
    }
    #dist-list::-webkit-scrollbar { width: 3px; }
    #dist-list::-webkit-scrollbar-track { background: transparent; }
    #dist-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .di {
      display: flex; align-items: center; padding: 6px 10px;
      border-radius: 7px; cursor: pointer; transition: background .1s; gap: 9px;
    }
    .di:hover { background: #1e293b; }
    .dd { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,.15); }
    .dn { font-size: 12px; flex: 1; color: #cbd5e1; }
    .ds { font-size: 9.5px; color: #64748b; white-space: nowrap; }

    /* footer */
    .sb-foot {
      padding: 9px 18px; border-top: 1px solid #1e293b;
      display: flex; gap: 5px; flex-shrink: 0;
    }
    .fb {
      flex: 1; padding: 7px 5px;
      background: #1e293b; color: #94a3b8;
      border: 1px solid #334155; border-radius: 7px;
      cursor: pointer; font-size: 10.5px; font-weight: 500;
      transition: all .15s; text-align: center;
    }
    .fb:hover { background: #334155; color: #e2e8f0; }
    .fb.on { background: #14532d; color: #4ade80; border-color: #166534; }

    /* ── MAP AREA ───────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* legend */
    #legend {
      position: absolute; bottom: 30px; right: 10px;
      background: #fff; border-radius: 10px; padding: 11px 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.18); z-index: 900; min-width: 148px;
    }
    #legend h4 {
      font-size: 10.5px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 9px;
    }
    .li { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; color: #475569; }
    .ls { width: 20px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); flex-shrink: 0; }

    /* loading overlay */
    #loading {
      position: absolute; inset: 0;
      background: rgba(9, 16, 32, .88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2000; backdrop-filter: blur(3px);
      color: #e2e8f0; transition: opacity .3s;
    }
    #loading.gone { display: none; }
    .spin {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #4ade80; border-radius: 50%;
      animation: rot .7s linear infinite; margin-bottom: 14px;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    .lt { font-size: 14px; font-weight: 500; }
    .ls2 { font-size: 11px; color: #64748b; margin-top: 5px; }

    /* custom tooltip */
    #tooltip {
      position: absolute; pointer-events: none; z-index: 1500;
      background: rgba(9, 16, 32, .93); color: #f1f5f9;
      padding: 8px 12px; border-radius: 8px; border: 1px solid #334155;
      box-shadow: 0 4px 14px rgba(0,0,0,.35); display: none;
      max-width: 200px; white-space: nowrap;
    }
    #tooltip .tn { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    #tooltip .ts { font-size: 11px; color: #94a3b8; }

    /* notification toast */
    #toast {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: #14532d; color: #dcfce7; padding: 8px 16px;
      border-radius: 8px; font-size: 12px; font-weight: 500;
      z-index: 3000; pointer-events: none;
      transition: opacity .3s; opacity: 0;
    }
    #toast.show { opacity: 1; }

    /* mode indicator */
    #mode-pill {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(9,16,32,.82); color: #94a3b8;
      padding: 5px 12px; border-radius: 99px; font-size: 11px;
      pointer-events: none; border: 1px solid #334155; z-index: 900;
      backdrop-filter: blur(4px); white-space: nowrap;
    }
    #mode-pill strong { color: #e2e8f0; }
  </style>
</head>

<body>

<!-- ── SIDEBAR ─────────────────────────────────────── -->
<div id="sidebar">

  <div class="sb-head">
    <h1>
      UP Coverage Tracker
      <span class="badge" id="dist-count">75 Districts</span>
    </h1>
    <p>Uttar Pradesh — Product Reach Dashboard</p>
  </div>

  <div class="sb-progress">
    <div class="prog-row">
      <span>Overall Coverage Score</span>
      <strong id="pct">0%</strong>
    </div>
    <div class="prog-track"><div class="prog-fill" id="pbar"></div></div>
    <div class="stats-grid">
      <div class="sc"><div class="sv" id="s-touched">0</div><div class="sl">Touched</div></div>
      <div class="sc"><div class="sv" id="s-estab">0</div><div class="sl">Estab.</div></div>
      <div class="sc"><div class="sv" id="s-full">0</div><div class="sl">Full</div></div>
    </div>
  </div>

  <div class="sb-ctrl">
    <div class="ctrl-label">Paint Mode — click map or list</div>
    <div class="paint-row" id="paint-row"></div>
  </div>

  <div class="sb-search">
    <input type="text" id="search" placeholder="&#128269;  Search districts…" autocomplete="off" />
  </div>

  <div id="dist-list"></div>

  <div class="sb-foot">
    <button class="fb" id="btn-export" title="Export CSV">&#8659; CSV</button>
    <button class="fb" id="btn-towns" title="Load towns from OSM">&#127981; Towns</button>
    <button class="fb" id="btn-2011" title="Load higher-detail boundaries (14 MB)">&#128249; HiRes</button>
    <button class="fb" id="btn-reset" title="Reset all">&#8635; Reset</button>
  </div>
</div>

<!-- ── MAP ────────────────────────────────────────────── -->
<div id="map-wrap">
  <div id="loading">
    <div class="spin"></div>
    <div class="lt">Loading Uttar Pradesh map…</div>
    <div class="ls2" id="lsub">Fetching data from GitHub</div>
  </div>

  <div id="map"></div>

  <div id="legend">
    <h4>Coverage Level</h4>
    <div id="leg-items"></div>
  </div>

  <div id="mode-pill">
    Paint mode: <strong id="mode-name">Entry Stage</strong>
  </div>

  <div id="tooltip">
    <div class="tn" id="tt-name"></div>
    <div class="ts" id="tt-status"></div>
  </div>

  <div id="toast"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   CONFIGURATION
═══════════════════════════════════════════════════════════ */

/** Five coverage levels – colours use a green progression. */
const LEVELS = [
  { id: 0, name: 'Not Started',   short: 'None',   color: '#e0e0e0', text: '#555' },
  { id: 1, name: 'Entry Stage',   short: 'Entry',  color: '#d9f0a3', text: '#2d5016' },
  { id: 2, name: 'Growing',       short: 'Grow',   color: '#78c679', text: '#1a3d0a' },
  { id: 3, name: 'Established',   short: 'Estab',  color: '#238443', text: '#fff'    },
  { id: 4, name: 'Full Coverage', short: 'Full',   color: '#004529', text: '#fff'    },
];

/**
 * HindustanTimesLabs – verified 752 KB all-India GeoJSON.
 * state property: st_nm === "Uttar Pradesh"
 */
const URL_FAST = 'https://raw.githubusercontent.com/HindustanTimesLabs/shapefiles/master/india/district/india_district.json';

/**
 * HindustanTimesLabs – 2011 census, higher-detail (~14 MB).
 * Same property schema as URL_FAST.
 */
const URL_HIRES = 'https://raw.githubusercontent.com/HindustanTimesLabs/shapefiles/master/india/district/india_2011_district.json';

/**
 * OpenStreetMap Overpass API – towns & cities within UP bounding box.
 * bbox: (south, west, north, east)  UP ≈ 23.85°N–30.42°N, 77.07°E–84.70°E
 */
const OVERPASS_URL   = 'https://overpass-api.de/api/interpreter';
const OVERPASS_QUERY = `[out:json][timeout:60];
node["place"~"^(city|town)$"](23.85,77.07,30.45,84.75);
out body;`;

const STATE_FILTER = 'Uttar Pradesh';
const STORAGE_KEY  = 'up_cov_v3';

/* ═══════════════════════════════════════════════════════════
   RUNTIME STATE
═══════════════════════════════════════════════════════════ */

let map;
let distGeoLayer = null;   // Leaflet GeoJSON layer (district polygons)
let townsLayer   = null;   // Leaflet LayerGroup (town dots)
let townsLoaded  = false;
let hiResLoaded  = false;

let paintLevel   = 1;          // currently selected level id

/**
 * coverage:  key (lower-case district name) → level id (0–4)
 * layers:    key → Leaflet path layer
 * names:     sorted list of original district names from GeoJSON
 */
let coverage  = {};
let layers    = {};
let names     = [];

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */

/** Extract district name from GeoJSON properties (handles multiple schemas). */
function propName(props) {
  return (props.district || props.dtname || props.NAME_2 || props.name || 'Unknown').trim();
}

/** Consistent storage key – lowercase, trimmed. */
function key(n) { return n.toLowerCase().trim(); }

/** Get coverage level for a district name (0 = default). */
function lvlOf(n) { return coverage[key(n)] ?? 0; }

/** Convert ALL-CAPS or mixed-case names to Title Case. */
function titleCase(s) {
  return s.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}

/* ═══════════════════════════════════════════════════════════
   MAP INITIALISATION
═══════════════════════════════════════════════════════════ */

function initMap() {
  map = L.map('map', {
    center: [26.5, 80.9],
    zoom: 7,
    zoomControl: false,
  });

  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  /* CartoDB Positron – clean light tiles, free, no API key needed. */
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' +
        ' contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20,
    }
  ).addTo(map);

  /* Move tooltip with mouse */
  map.getContainer().addEventListener('mousemove', onMouseMove);
}

/* ═══════════════════════════════════════════════════════════
   DATA LOADING — DISTRICTS
═══════════════════════════════════════════════════════════ */

async function loadDistricts(url, label) {
  setLSub(`Fetching ${label}…`);
  showLoading();

  let geojson;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    geojson = await res.json();
  } catch (err) {
    setLSub(`Error: ${err.message} — check internet connection.`);
    console.error('District load failed:', err);
    return;
  }

  /* Filter to Uttar Pradesh only */
  const features = geojson.features.filter(f => {
    const sn = (f.properties.st_nm || f.properties.ST_NM || '').trim();
    return sn === STATE_FILTER;
  });

  if (features.length === 0) {
    setLSub('No UP features found – unexpected data format.');
    return;
  }

  /* Remove old layer if reloading hi-res */
  if (distGeoLayer) {
    map.removeLayer(distGeoLayer);
    distGeoLayer = null;
    layers = {};
    names  = [];
  }

  renderDistricts({ type: 'FeatureCollection', features });
  hideLoading();
  toast(`Loaded ${features.length} districts (${label})`);
}

/* ═══════════════════════════════════════════════════════════
   RENDERING — DISTRICT POLYGONS
═══════════════════════════════════════════════════════════ */

function styleFor(feature) {
  const l = lvlOf(propName(feature.properties));
  return {
    fillColor:   LEVELS[l].color,
    weight:      1.2,
    color:       '#666',
    opacity:     0.85,
    fillOpacity: 0.75,
  };
}

function highlightStyle(feature) {
  const l = lvlOf(propName(feature.properties));
  return {
    fillColor:   LEVELS[l].color,
    weight:      3,
    color:       '#1e293b',
    opacity:     1,
    fillOpacity: 0.9,
  };
}

function renderDistricts(geojson) {
  distGeoLayer = L.geoJSON(geojson, {
    style: styleFor,
    onEachFeature(feature, layer) {
      const n = propName(feature.properties);
      const k = key(n);

      layers[k] = layer;
      if (!names.includes(n)) names.push(n);

      /* ── click: paint coverage level ── */
      layer.on('click', () => {
        coverage[k] = paintLevel;
        layer.setStyle(styleFor(feature));
        saveData();
        updateStats();
        renderList();
      });

      /* ── hover ── */
      layer.on('mouseover', () => {
        layer.setStyle(highlightStyle(feature));
        layer.bringToFront();
        showTooltip(titleCase(n), LEVELS[lvlOf(n)].name);
      });
      layer.on('mouseout', () => {
        layer.setStyle(styleFor(feature));
        hideTooltip();
      });
    },
  }).addTo(map);

  names.sort();
  map.fitBounds(distGeoLayer.getBounds(), { padding: [16, 16] });
  document.getElementById('dist-count').textContent = `${names.length} Districts`;
  renderList();
  updateStats();
}

/* ═══════════════════════════════════════════════════════════
   DATA LOADING — TOWNS (OpenStreetMap via Overpass API)
═══════════════════════════════════════════════════════════ */

async function loadTowns() {
  if (townsLoaded && townsLayer) {
    townsLayer.addTo(map);
    return;
  }

  setLSub('Querying OpenStreetMap for towns & cities…');
  showLoading();

  let data;
  try {
    const res = await fetch(OVERPASS_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:    'data=' + encodeURIComponent(OVERPASS_QUERY),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    hideLoading();
    toast('Could not load towns – try again later');
    console.error('Overpass error:', err);
    return;
  }

  townsLayer = L.layerGroup();

  data.elements.forEach(el => {
    if (!el.lat || !el.lon) return;
    const isCity = el.tags.place === 'city';
    const name   = el.tags['name:en'] || el.tags.name || '';
    if (!name) return;

    const marker = L.circleMarker([el.lat, el.lon], {
      radius:      isCity ? 7 : 4,
      fillColor:   isCity ? '#dc2626' : '#1d4ed8',
      color:       '#fff',
      weight:      1.5,
      fillOpacity: 0.88,
    });

    marker.bindTooltip(
      `<b>${name}</b><br><span style="color:#94a3b8;font-size:10px">${isCity ? 'City' : 'Town'}</span>`,
      { direction: 'top', offset: [0, -6] }
    );

    marker.addTo(townsLayer);
  });

  townsLoaded = true;
  townsLayer.addTo(map);
  hideLoading();
  toast(`Loaded ${data.elements.length} towns/cities from OpenStreetMap`);
}

function toggleTowns() {
  const btn = document.getElementById('btn-towns');
  const vis = map.hasLayer(townsLayer);

  if (vis) {
    map.removeLayer(townsLayer);
    btn.classList.remove('on');
    btn.textContent = '🏘 Towns';
  } else {
    btn.classList.add('on');
    btn.textContent = '🏘 ✕ Towns';
    loadTowns();
  }
}

/* ═══════════════════════════════════════════════════════════
   UI — PAINT BUTTONS
═══════════════════════════════════════════════════════════ */

function buildPaintButtons() {
  const row = document.getElementById('paint-row');
  LEVELS.forEach(lvl => {
    const btn = document.createElement('button');
    btn.className = 'pb' + (lvl.id === paintLevel ? ' active' : '');
    btn.style.background = lvl.color;
    btn.style.color       = lvl.text;
    btn.textContent       = lvl.short;
    btn.title             = lvl.name;
    btn.addEventListener('click', () => {
      paintLevel = lvl.id;
      document.querySelectorAll('.pb').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('mode-name').textContent = lvl.name;
    });
    row.appendChild(btn);
  });
}

/* ═══════════════════════════════════════════════════════════
   UI — LEGEND
═══════════════════════════════════════════════════════════ */

function buildLegend() {
  const c = document.getElementById('leg-items');
  LEVELS.forEach(lvl => {
    const d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = `<div class="ls" style="background:${lvl.color}"></div>${lvl.name}`;
    c.appendChild(d);
  });
}

/* ═══════════════════════════════════════════════════════════
   UI — DISTRICT LIST
═══════════════════════════════════════════════════════════ */

function renderList() {
  const query = document.getElementById('search').value.toLowerCase();
  const c     = document.getElementById('dist-list');
  c.innerHTML = '';

  const filtered = names.filter(n => titleCase(n).toLowerCase().includes(query));

  if (filtered.length === 0 && query) {
    c.innerHTML = '<div style="padding:14px;text-align:center;color:#475569;font-size:12px;">No match found</div>';
    return;
  }

  filtered.forEach(n => {
    const l   = LEVELS[lvlOf(n)];
    const k   = key(n);
    const div = document.createElement('div');
    div.className = 'di';
    div.innerHTML = `
      <div class="dd" style="background:${l.color}"></div>
      <div class="dn">${titleCase(n)}</div>
      <div class="ds">${l.name}</div>
    `;

    /* click list item → paint + zoom */
    div.addEventListener('click', () => {
      coverage[k] = paintLevel;
      if (layers[k]) layers[k].setStyle(styleFor(layers[k].feature));
      saveData();
      updateStats();
      renderList();
      if (layers[k]) map.fitBounds(layers[k].getBounds(), { padding: [60, 60], maxZoom: 11 });
    });

    /* hover list item → highlight polygon */
    div.addEventListener('mouseenter', () => {
      if (layers[k]) {
        layers[k].setStyle(highlightStyle(layers[k].feature));
        layers[k].bringToFront();
      }
    });
    div.addEventListener('mouseleave', () => {
      if (layers[k]) layers[k].setStyle(styleFor(layers[k].feature));
    });

    c.appendChild(div);
  });
}

/* ═══════════════════════════════════════════════════════════
   UI — STATS
═══════════════════════════════════════════════════════════ */

function updateStats() {
  const total = names.length;
  if (!total) return;

  let touched = 0, estab = 0, full = 0, weightedSum = 0;
  names.forEach(n => {
    const l = lvlOf(n);
    if (l > 0) touched++;
    if (l >= 3) estab++;
    if (l === LEVELS.length - 1) full++;
    weightedSum += l;
  });

  const maxPoss = total * (LEVELS.length - 1);
  const pct     = Math.round((weightedSum / maxPoss) * 100);

  document.getElementById('pbar').style.width          = pct + '%';
  document.getElementById('pct').textContent            = pct + '%';
  document.getElementById('s-touched').textContent      = touched;
  document.getElementById('s-estab').textContent        = estab;
  document.getElementById('s-full').textContent         = full;
}

/* ═══════════════════════════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════════════════════════ */

function showTooltip(name, status) {
  document.getElementById('tt-name').textContent   = name;
  document.getElementById('tt-status').textContent = status;
  document.getElementById('tooltip').style.display = 'block';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

function onMouseMove(e) {
  const tip  = document.getElementById('tooltip');
  if (tip.style.display === 'none') return;
  const rect = document.getElementById('map-wrap').getBoundingClientRect();
  const x    = e.clientX - rect.left;
  const y    = e.clientY - rect.top;
  tip.style.left = (x + 14) + 'px';
  tip.style.top  = (y - 44) + 'px';
}

/* ═══════════════════════════════════════════════════════════
   LOADING OVERLAY
═══════════════════════════════════════════════════════════ */

function showLoading() { document.getElementById('loading').classList.remove('gone'); }
function hideLoading()  { document.getElementById('loading').classList.add('gone'); }
function setLSub(t)     { document.getElementById('lsub').textContent = t; }

/* ═══════════════════════════════════════════════════════════
   TOAST NOTIFICATION
═══════════════════════════════════════════════════════════ */

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ═══════════════════════════════════════════════════════════
   DATA PERSISTENCE (localStorage)
═══════════════════════════════════════════════════════════ */

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(coverage)); } catch (_) {}
}

function loadSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) coverage = JSON.parse(raw);
  } catch (_) { coverage = {}; }
}

/* ═══════════════════════════════════════════════════════════
   EXPORT CSV
═══════════════════════════════════════════════════════════ */

function exportCSV() {
  let csv = 'District,Coverage Level ID,Coverage Status\n';
  names.forEach(n => {
    const l = lvlOf(n);
    csv += `"${titleCase(n)}",${l},"${LEVELS[l].name}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `UP_Coverage_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Coverage data exported as CSV');
}

/* ═══════════════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════════════ */

function resetCoverage() {
  if (!confirm('Reset all coverage data? This cannot be undone.')) return;
  coverage = {};
  names.forEach(n => {
    const k = key(n);
    if (layers[k]) layers[k].setStyle(styleFor(layers[k].feature));
  });
  localStorage.removeItem(STORAGE_KEY);
  updateStats();
  renderList();
  toast('All coverage data has been reset');
}

/* ═══════════════════════════════════════════════════════════
   WIRE BUTTONS
═══════════════════════════════════════════════════════════ */

function wireButtons() {
  document.getElementById('btn-export').addEventListener('click', exportCSV);
  document.getElementById('btn-reset').addEventListener('click', resetCoverage);
  document.getElementById('btn-towns').addEventListener('click', toggleTowns);

  document.getElementById('btn-2011').addEventListener('click', async () => {
    if (hiResLoaded) { toast('High-res boundaries already loaded'); return; }
    const ok = confirm(
      'Load high-resolution 2011 census boundaries?\n\n' +
      'This file is ~14 MB and may take several seconds on slower connections.'
    );
    if (!ok) return;
    hiResLoaded = true;
    await loadDistricts(URL_HIRES, '2011 Census Hi-Res');
    document.getElementById('btn-2011').classList.add('on');
    document.getElementById('btn-2011').textContent = '🖼 HiRes ✓';
  });

  document.getElementById('search').addEventListener('input', renderList);
}

/* ═══════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */

function boot() {
  loadSavedData();   // restore previous session
  initMap();
  buildPaintButtons();
  buildLegend();
  wireButtons();
  loadDistricts(URL_FAST, 'Standard');
}

boot();
</script>
</body>
</html>
